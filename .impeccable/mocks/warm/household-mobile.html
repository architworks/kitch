<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Kitch — Household mobile</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5f1e8;--card:#fffdf8;--line:#e7dfd0;--line2:#efe8db;--ink:#1f2a1f;--ink2:#4c5446;--mute:#7a7c6c;--olive:#3f4229;--green:#2f5536;--green2:#3f6b45;--sage:#e3ead8;--sage2:#cfdcc0;--turmeric:#d98b2b;--display:"Bricolage Grotesque",system-ui,sans-serif;--ui:"Figtree",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden}
body{font:15px/1.45 var(--ui);color:var(--ink);background:var(--paper);font-variant-numeric:tabular-nums;position:relative}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;border:0;background:none}
header{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
header img{width:28px}
header b{font:700 22px var(--display);color:var(--green);letter-spacing:-.02em}
.av{margin-left:auto;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 4px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.av span{width:28px;height:28px;border-radius:50%;background:var(--turmeric);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.hero{margin:0 16px;border-radius:22px;overflow:hidden;background:var(--olive) url(../../../frontend/public/countertop.png) 78% 66%/215% auto no-repeat;color:#fbf5e9;padding:20px 18px 18px;min-height:286px;display:flex;flex-direction:column}
.greet{font:700 28px/1.08 var(--display);letter-spacing:-.03em;padding:4px 16px 14px;color:var(--ink)}
.hero .t{margin-top:auto;background:rgba(40,42,26,.72);backdrop-filter:blur(6px);border-radius:16px;padding:12px 14px;margin-top:70px}
.hero .when{color:#f1c27f;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center}
.hero .when svg{width:15px;height:15px}
.hero h2{font:650 20px/1.15 var(--display);margin:3px 0 4px}
.hero p.m{font-size:13px;color:#d9d5c2}
.acts{display:flex;gap:8px;margin-top:12px}
.b{height:38px;padding:0 14px;border-radius:11px;font-weight:650;font-size:14px}
.b.light{background:#fbf5e9;color:var(--olive)}.b.ghost{box-shadow:inset 0 0 0 1px rgba(251,245,233,.38);color:#fbf5e9}
.sec{padding:18px 16px 0}
.sec h3{font:700 20px var(--display);letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
.sec h3 span{font:500 14px var(--ui);color:var(--mute)}
.days{display:flex;gap:7px;margin:12px -16px 10px;padding:0 16px;overflow:hidden}
.day{flex:none;width:52px;border-radius:13px;padding:8px 0 7px;text-align:center;border:1px solid var(--line);background:var(--card)}
.day small{display:block;font-size:11.5px;font-weight:600;color:var(--mute)}
.day b{display:block;font:700 19px/1.15 var(--display)}
.dots{display:flex;justify-content:center;gap:3px;margin-top:4px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--green2)}.dots i.o{background:none;box-shadow:inset 0 0 0 1.5px var(--sage2)}
.day.today{background:var(--green);border-color:var(--green);color:#fbf5e9}.day.today small{color:#cfe0c8}.day.today .dots i{background:#fbf5e9}.day.past{opacity:.55}
.meal{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:8px}
.mi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.mi.b1{background:#fbefd9;color:#c47a1d}.mi.l1{background:var(--sage);color:var(--green)}.mi.d1{background:#e6e4f1;color:#4b4a7a}
.meal small{display:block;color:var(--mute);font-size:12.5px}.meal strong{font-size:15px;font-weight:650;line-height:1.25;display:block}
.meal .st{margin-left:auto;color:var(--turmeric);font-weight:650;font-size:12.5px}
.composer{position:absolute;left:12px;right:12px;bottom:76px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 30px -14px rgba(63,66,41,.5);display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px}
.composer img{width:22px}.composer .ph{flex:1;color:var(--mute);font-size:14.5px}
.composer .ib{width:34px;height:34px;display:grid;place-items:center;color:var(--ink2)}
.send{width:38px;height:38px;border-radius:12px;background:var(--green);color:#fbf5e9;display:grid;place-items:center}
.tabs{position:absolute;left:0;right:0;bottom:0;height:66px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:8px}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--mute);text-decoration:none}
.tabs a.on{color:var(--green)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="home" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
<symbol id="book" viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></symbol>
<symbol id="basket" viewBox="0 0 24 24"><path d="m15 11-1 9M19 11l-4-7M2 11h20M3.5 11l1.6 7.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6l1.7-7.4M5 11l4-7M9 11l1 9"/></symbol>
<symbol id="chart" viewBox="0 0 24 24"><path d="M3 3v18h18M19 9l-5 5-4-4-3 3"/></symbol>
<symbol id="sunrise" viewBox="0 0 24 24"><path d="M12 2v6M4.9 10.9l1.4 1.4M2 18h2M20 18h2M19.1 10.9l-1.4 1.4M22 22H2M8 6l4-4 4 4M16 18a4 4 0 0 0-8 0"/></symbol>
<symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></symbol>
<symbol id="moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
<symbol id="img" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></symbol>
<symbol id="cam" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></symbol>
<symbol id="up" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 19V5"/></symbol>
</defs></svg>
<header><img src="../../../frontend/public/kitch-chef-hat.svg" alt=""><b>Kitch</b><button class="av"><span>A</span>Archit</button></header>
<h1 class="greet">Good evening, Archit</h1>
<section class="hero">
  <div class="t"><p class="when"><svg class="i"><use href="#moon"/></svg>Tonight’s dinner</p><h2>Aloo gobi with roti and dal fry</h2><p class="m">For 3 · 35 min · 3 ingredients to buy</p>
  <div class="acts"><button class="b light">Open recipe</button><button class="b ghost">Swap</button><button class="b ghost">Log</button></div></div></section>
<section class="sec"><h3>This week <span>12 – 18 Oct</span></h3>
  <div class="days">
    <div class="day past"><small>Mon</small><b>12</b><div class="dots"><i></i><i></i><i></i></div></div>
    <div class="day past"><small>Tue</small><b>13</b><div class="dots"><i></i><i></i><i></i></div></div>
    <div class="day past"><small>Wed</small><b>14</b><div class="dots"><i></i><i></i><i></i></div></div>
    <div class="day today"><small>Today</small><b>15</b><div class="dots"><i></i><i></i><i></i></div></div>
    <div class="day"><small>Fri</small><b>16</b><div class="dots"><i></i><i></i><i></i></div></div>
    <div class="day"><small>Sat</small><b>17</b><div class="dots"><i></i><i class="o"></i><i class="o"></i></div></div>
  </div>
  <div class="meal"><span class="mi b1"><svg class="i"><use href="#sunrise"/></svg></span><div><small>Breakfast · 8:30 am</small><strong>Berry smoothie bowl</strong></div></div>
  <div class="meal"><span class="mi l1"><svg class="i"><use href="#sun"/></svg></span><div><small>Lunch · 1:00 pm</small><strong>Rajma chawal</strong></div></div>
</section>
<form class="composer"><img src="../../../frontend/public/kitch-chef-hat.svg" alt=""><span class="ph">Ask Kitch…</span><span class="ib"><svg class="i"><use href="#img"/></svg></span><span class="ib"><svg class="i"><use href="#cam"/></svg></span><button class="send"><svg class="i"><use href="#up"/></svg></button></form>
<nav class="tabs"><a class="on" href="#"><svg class="i"><use href="#home"/></svg>Home</a><a href="#"><svg class="i"><use href="#book"/></svg>Recipes</a><a href="#"><svg class="i"><use href="#basket"/></svg>Groceries</a><a href="#"><svg class="i"><use href="#chart"/></svg>Nutrition</a></nav>
</body></html>
